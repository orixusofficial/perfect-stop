<svg viewBox="0 0 120 120" width="120" height="120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Charcoal Rough Track Pattern -->
    <linearGradient id="charcoalTrack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a1a1a" />
      <stop offset="35%" stop-color="#3d3d3d" />
      <stop offset="65%" stop-color="#262626" />
      <stop offset="100%" stop-color="#0f0f0f" />
    </linearGradient>

    <!-- Moss Green Stone Base Gradient -->
    <radialGradient id="greenStone" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#a3c9a8" />
      <stop offset="45%" stop-color="#608b66" />
      <stop offset="85%" stop-color="#38583d" />
      <stop offset="100%" stop-color="#1f3623" />
    </radialGradient>

    <!-- Inner Golden Ring Gradient -->
    <radialGradient id="goldRing" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fffbba" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Slim, Slightly Wavy Charcoal Track Line -->
  <g filter="url(#shadow)">
    <!-- Main Wavy Path -->
    <path d="M 60,6 C 62,25 58,40 60,60 C 62,80 58,95 60,114" fill="none" stroke="url(#charcoalTrack)" stroke-width="4.5" stroke-linecap="round" />
    <!-- Rough Charcoal Texture Strokes -->
    <path d="M 59.5,8 C 61.5,25 57.5,40 59.5,60 C 61.5,80 57.5,95 59.5,112" fill="none" stroke="#0f0f0f" stroke-width="1.5" stroke-dasharray="3 1 5 2" opacity="0.7" />
  </g>

  <!-- Chiseled Moss Green Stone Rune Knob -->
  <g transform="translate(60, 60)" filter="url(#shadow)">
    <!-- Organic Irregular Stone Body -->
    <path d="M -2,-21 
             C 6,-21 13,-18 18,-12 
             C 22,-6 22,3 19,10 
             C 16,17 9,21 0,21 
             C -9,21 -17,17 -20,10 
             C -23,3 -21,-7 -16,-14 
             C -11,-20 -7,-21 -2,-21 Z" fill="url(#greenStone)" stroke="#192e1e" stroke-width="1.5" stroke-linejoin="round" />

    <!-- Chiseled Edge Bevel Highlights -->
    <path d="M -16,-14 C -11,-20 -7,-21 -2,-21 C 6,-21 13,-18 18,-12" fill="none" stroke="#c8e6ca" stroke-width="1.2" opacity="0.6" />
    <path d="M 18,-12 C 22,-6 22,3 19,10" fill="none" stroke="#25422a" stroke-width="1.2" opacity="0.8" />

    <!-- Cracks & Weathering Marks -->
    <path d="M -15,-5 L -10,-8 L -12,-12" fill="none" stroke="#192e1e" stroke-width="1" stroke-linecap="round" />
    <path d="M 14,-6 L 9,-3 L 13,2" fill="none" stroke="#192e1e" stroke-width="1" stroke-linecap="round" />
    <path d="M -6,14 L -3,10 L 2,12" fill="none" stroke="#192e1e" stroke-width="1" stroke-linecap="round" />

    <!-- Central Glowing Gold Ring & Inner Recess -->
    <circle cx="0" cy="0" r="10.5" fill="#192e1e" stroke="#142417" stroke-width="1" />
    <circle cx="0" cy="0" r="9.5" fill="none" stroke="url(#goldRing)" stroke-width="3" />
    <circle cx="0" cy="0" r="6.5" fill="url(#greenStone)" />
    
    <!-- Gold Ring Highlight Dot -->
    <circle cx="-3" cy="-4" r="1.2" fill="#ffffff" opacity="0.9" />
  </g>
</svg>