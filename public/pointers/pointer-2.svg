<svg viewBox="0 0 120 120" width="120" height="120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Liquid Silver / Chrome Shading Gradient -->
    <linearGradient id="liquidSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#d1d5db" />
      <stop offset="70%" stop-color="#9ca3af" />
      <stop offset="100%" stop-color="#4b5563" />
    </linearGradient>

    <!-- Golden Pearl Knob Shading -->
    <radialGradient id="goldenPearl" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#854d0e" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Liquid Silver & Golden Pearl Slider (120x120px, slim & perfectly fitted) -->
  <g filter="url(#shadow)">
    
    <!-- Top Liquid Silver Drop -->
    <g transform="translate(60, 22)">
      <!-- Pear-shaped liquid drop droplet -->
      <path d="M 0,-14 C 4,-8 7,-2 7,3 C 7,8 3,11 0,11 C -3,11 -7,8 -7,3 C -7,-2 -4,-8 0,-14 Z" fill="url(#liquidSilver)" stroke="#374151" stroke-width="1" />
      <!-- Top elongation stem -->
      <path d="M 0,-14 C 0,-18 0.5,-20 0.5,-20 C 0.5,-20 1,-18 0,-14 Z" fill="url(#liquidSilver)" />
      <!-- Highlight reflection -->
      <ellipse cx="-2" cy="1" rx="1.5" ry="3" fill="#ffffff" opacity="0.85" transform="rotate(-15 -2 1)" />
    </g>

    <!-- Bottom Liquid Silver Drop (Inverted pear shape) -->
    <g transform="translate(60, 98)">
      <path d="M 0,14 C 4,8 7,2 7,-3 C 7,-8 3,-11 0,-11 C -3,-11 -7,-8 -7,-3 C -7,2 -4,8 0,14 Z" fill="url(#liquidSilver)" stroke="#374151" stroke-width="1" />
      <path d="M 0,14 C 0,18 0.5,20 0.5,20 C 0.5,20 1,18 0,14 Z" fill="url(#liquidSilver)" />
      <ellipse cx="-2" cy="-1" rx="1.5" ry="3" fill="#ffffff" opacity="0.85" transform="rotate(15 -2 -1)" />
    </g>

    <!-- Center Golden Pearl Knob -->
    <g transform="translate(60, 60)">
      <!-- Outer warm glow ring -->
      <circle cx="0" cy="0" r="23" fill="#ca8a04" opacity="0.3" />
      <!-- Main golden pearl sphere -->
      <circle cx="0" cy="0" r="21.5" fill="url(#goldenPearl)" stroke="#713f12" stroke-width="1.2" />
      
      <!-- Glossy Highlights -->
      <path d="M -9,-12 C -4,-16 4,-16 9,-12 C 5,-14 -5,-14 -9,-12 Z" fill="#ffffff" opacity="0.9" />
      <ellipse cx="-6" cy="-10" rx="3.5" ry="1.8" fill="#ffffff" opacity="0.95" transform="rotate(-25 -6 -10)" />
    </g>

  </g>
</svg>