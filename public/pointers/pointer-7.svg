<svg viewBox="0 0 120 120" width="120" height="120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Red Cube Gradient -->
    <linearGradient id="cubeRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b7b" />
      <stop offset="50%" stop-color="#e63946" />
      <stop offset="100%" stop-color="#9b111e" />
    </linearGradient>

    <!-- Green Cube Gradient -->
    <linearGradient id="cubeGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e635" />
      <stop offset="50%" stop-color="#65a30d" />
      <stop offset="100%" stop-color="#365314" />
    </linearGradient>

    <!-- Rainbow / Orange Center Cube Gradient -->
    <linearGradient id="cubeRainbow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="35%" stop-color="#fb923c" />
      <stop offset="70%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Blue Cube Gradient -->
    <linearGradient id="cubeBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Yellow Cube Gradient -->
    <linearGradient id="cubeYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Stacked Toy Cubes (Slim & Long, perfectly fitted within 120x120) -->
  <g filter="url(#shadow)">
    <!-- Top Cube (Red) -->
    <g transform="translate(60, 14)">
      <rect x="-14" y="-12" width="28" height="24" rx="6" fill="url(#cubeRed)" stroke="#7f1d1d" stroke-width="1.2" />
      <path d="M -8,-6 C -4,-10 4,-10 8,-6" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    </g>

    <!-- Second Cube (Green) -->
    <g transform="translate(60, 37)">
      <rect x="-14" y="-11" width="28" height="22" rx="5.5" fill="url(#cubeGreen)" stroke="#14532d" stroke-width="1.2" />
      <path d="M -8,-5 C -4,-9 4,-9 8,-5" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    </g>

    <!-- Center Main Big Cube with Bear Icon (Rainbow Gradient / Orange face) -->
    <g transform="translate(60, 64)">
      <rect x="-21" y="-21" width="42" height="42" rx="8" fill="url(#cubeRainbow)" stroke="#7c2d12" stroke-width="1.5" />
      
      <!-- Inner Cute Panel / Bear Face Container -->
      <rect x="-13" y="-13" width="26" height="26" rx="5" fill="#fef3c7" stroke="#b45309" stroke-width="1" />
      
      <!-- Cute Little Bear Head -->
      <circle cx="0" cy="-1" r="7" fill="#d97706" />
      <circle cx="-6" cy="-8" r="3" fill="#d97706" />
      <circle cx="6" cy="-8" r="3" fill="#d97706" />
      <circle cx="-6" cy="-8" r="1.5" fill="#fde68a" />
      <circle cx="6" cy="-8" r="1.5" fill="#fde68a" />
      <!-- Bear Eyes & Nose -->
      <circle cx="-2.5" cy="-2" r="1" fill="#451a03" />
      <circle cx="2.5" cy="-2" r="1" fill="#451a03" />
      <ellipse cx="0" cy="0.5" rx="1.2" ry="0.8" fill="#451a03" />
      <path d="M -1.5,2.5 C -0.8,3.5 0.8,3.5 1.5,2.5" fill="none" stroke="#451a03" stroke-width="0.8" stroke-linecap="round" />

      <!-- Top Highlight on Center Cube -->
      <path d="M -13,-17 C -6,-20 6,-20 13,-17" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7" />
    </g>

    <!-- Fourth Cube (Blue) -->
    <g transform="translate(60, 91)">
      <rect x="-14" y="-11" width="28" height="22" rx="5.5" fill="url(#cubeBlue)" stroke="#1e3a8a" stroke-width="1.2" />
      <path d="M -8,-5 C -4,-9 4,-9 8,-5" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    </g>

    <!-- Bottom Cube (Yellow) -->
    <g transform="translate(60, 110)">
      <rect x="-14" y="-10" width="28" height="20" rx="5" fill="url(#cubeYellow)" stroke="#713f12" stroke-width="1.2" />
      <path d="M -8,-4 C -4,-8 4,-8 8,-4" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    </g>
  </g>
</svg>