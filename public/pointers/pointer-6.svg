<svg viewBox="0 0 120 120" width="120" height="120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Track Rainbow Gradient -->
    <linearGradient id="trackRainbow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff595e" />
      <stop offset="25%" stop-color="#ffca3a" />
      <stop offset="50%" stop-color="#8ac926" />
      <stop offset="75%" stop-color="#1982c4" />
      <stop offset="100%" stop-color="#6a4c93" />
    </linearGradient>

    <!-- Splat Rainbow Gradient -->
    <linearGradient id="splatRainbow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b" />
      <stop offset="30%" stop-color="#ffd166" />
      <stop offset="55%" stop-color="#06d6a0" />
      <stop offset="80%" stop-color="#118ab2" />
      <stop offset="100%" stop-color="#9d4edd" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Slim Vertical Track -->
  <g filter="url(#shadow)">
    <!-- White Outline Track -->
    <rect x="51" y="8" width="18" height="104" rx="9" fill="#ffffff" />
    <!-- Rainbow Fill Track -->
    <rect x="53" y="10" width="14" height="100" rx="7" fill="url(#trackRainbow)" />
    <!-- Track Inner Highlight -->
    <rect x="54" y="11" width="4" height="98" rx="2" fill="#ffffff" opacity="0.4" />
  </g>

  <!-- Central Rainbow Paint Splat Knob -->
  <g transform="translate(60, 60)" filter="url(#shadow)">
    <!-- Organic Splat Shape -->
    <path d="M -2,-21 
             C 4,-21 7,-16 11,-17 
             C 16,-18 19,-23 23,-18 
             C 27,-13 22,-9 24,-4 
             C 26,1 30,5 28,10 
             C 26,15 20,13 18,18 
             C 16,23 18,27 12,27 
             C 6,27 4,21 -1,22 
             C -6,23 -10,26 -14,23 
             C -18,20 -15,15 -19,11 
             C -23,7 -27,6 -26,0 
             C -25,-6 -20,-8 -22,-13 
             C -24,-18 -19,-19 -14,-18 
             C -9,-17 -8,-21 -2,-21 Z" fill="url(#splatRainbow)" stroke="#2b2d42" stroke-width="1.2" />

    <!-- Top Highlight curves on Splat -->
    <path d="M -10,-13 C -5,-17 3,-17 8,-12" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <circle cx="-13" cy="-6" r="1.8" fill="#ffffff" opacity="0.8" />
    <circle cx="14" cy="-3" r="1.5" fill="#ffffff" opacity="0.8" />

    <!-- Cute Face Features -->
    <circle cx="-6" cy="-2" r="2.2" fill="#1d3557" />
    <circle cx="6" cy="-2" r="2.2" fill="#1d3557" />
    <path d="M -5,4 C -2,8 2,8 5,4" fill="none" stroke="#1d3557" stroke-width="1.8" stroke-linecap="round" />
  </g>

  <!-- Side Splatter Droplets -->
  <g filter="url(#shadow)">
    <circle cx="43" cy="42" r="3" fill="#ff70a6" stroke="#2b2d42" stroke-width="0.8" />
    <circle cx="42" cy="41" r="0.8" fill="#ffffff" opacity="0.8" />

    <circle cx="38" cy="78" r="3.5" fill="#4ea8de" stroke="#2b2d42" stroke-width="0.8" />
    <circle cx="37" cy="77" r="0.9" fill="#ffffff" opacity="0.8" />

    <circle cx="82" cy="72" r="3" fill="#b5179e" stroke="#2b2d42" stroke-width="0.8" />
    <circle cx="81" cy="71" r="0.8" fill="#ffffff" opacity="0.8" />
  </g>
</svg>